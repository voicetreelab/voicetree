name: Assure HTTP

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Capture the head of voicetree.io/
        run: curl -sS --http1.1 -I https://voicetree.io/ > http-fixture/head-001.txt

      - name: Capture the head of www.voicetree.io/
        run: curl -sS --http1.1 -I https://www.voicetree.io/ > http-fixture/head-002.txt

      - name: Check each head starts with HTTP/1.1
        run: |
          for f in http-fixture/head-*.txt; do
            head -n 1 "$f" | grep -q '^HTTP/1\.1 ' || { echo "::error file=$f::first line is not HTTP/1.1: $(head -n 1 "$f")"; exit 1; }
          done

      # Workaround: action.yml at v0.1.0-beta.2 is invalid YAML (two unquoted
      # descriptions contain ": "), so GitHub cannot load it via `uses:`.
      # Check out the same pinned commit and quote those descriptions only.
      # Revert to `uses: Symbolia-Assurance/assure-action@<sha>` once fixed upstream.
      - name: Check out the Assure Action at its pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Symbolia-Assurance/assure-action
          ref: 3c722a24a03e5e8554b0e416ddb55be8e39def50 # v0.1.0-beta.2
          path: .assure-action
          persist-credentials: false

      - name: Quote the unparseable descriptions in action.yml
        run: |
          python3 - <<'PY'
          import re
          p = ".assure-action/action.yml"
          lines = open(p).read().split("\n")
          for i, l in enumerate(lines):
              m = re.match(r"^(\s*description: )(.*)$", l)
              if m and ": " in m.group(2) and not m.group(2).startswith(("'", '"')):
                  lines[i] = m.group(1) + "'" + m.group(2).replace("'", "''") + "'"
          open(p, "w").write("\n".join(lines))
          PY
          git -C .assure-action diff --stat

      - name: Assure check
        id: assure
        uses: ./.assure-action
        with:
          api-key: ${{ secrets.ASSURE_API_KEY }}
          profile: http-observed-baseline
          artefacts: http-fixture
          fail-on: fails
          report: true
          output: assure-verdict.json

      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assure-verdict
          path: ${{ steps.assure.outputs.verdict-path || 'assure-verdict.json' }}
