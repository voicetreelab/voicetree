name: Assure HTTP

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Capture the head of voicetree.io/
        run: curl -sS --http1.1 -I https://voicetree.io/ > http-fixture/head-001.txt

      - name: Capture the head of www.voicetree.io/
        run: curl -sS --http1.1 -I https://www.voicetree.io/ > http-fixture/head-002.txt

      - name: Capture the head of share-worker /upload
        run: curl -sS --http1.1 -I https://share-worker.manummasson8.workers.dev/upload > http-fixture/head-003.txt

      - name: Check each head starts with HTTP/1.1
        run: |
          for f in http-fixture/head-*.txt; do
            head -n 1 "$f" | grep -q '^HTTP/1\.1 ' || { echo "::error file=$f::first line is not HTTP/1.1: $(head -n 1 "$f")"; exit 1; }
          done

      - name: Assure check
        id: assure
        uses: Symbolia-Assurance/assure-action@3c722a24a03e5e8554b0e416ddb55be8e39def50 # v0.1.0-beta.2
        with:
          api-key: ${{ secrets.ASSURE_API_KEY }}
          profile: http-observed-baseline
          artefacts: http-fixture
          fail-on: fails
          report: true
          output: assure-verdict.json

      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assure-verdict
          path: ${{ steps.assure.outputs.verdict-path || 'assure-verdict.json' }}
